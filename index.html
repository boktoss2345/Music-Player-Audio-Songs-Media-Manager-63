/* ---- View root: delegated interactions ---- */
viewRoot.addEventListener('click', e => {
  // Action buttons first
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    e.stopPropagation();
    const id = actBtn.dataset.id;
    if (actBtn.dataset.act === 'fav') toggleFavorite(id);
    else if (actBtn.dataset.act === 'menu') {
      const r = actBtn.getBoundingClientRect();
      showContextMenu(id, r.left - 190, r.bottom + 6);
    }
    return;
  }

  // Play album / shuffle album / etc.
  const playBtn = e.target.closest('[data-playalbum]');
  if (playBtn) {
    const key = playBtn.dataset.playalbum;
    const ids = listRegistry.get(key) || [];
    if (!ids.length) return;
    setQueue(ids, 0);
    playSong(ids[0]);
    return;
  }
  const shuffleBtn = e.target.closest('[data-shufflealbum]');
  if (shuffleBtn) {
    const key = shuffleBtn.dataset.shufflealbum;
    const ids = listRegistry.get(key) || [];
    if (!ids.length) return;
    if (!player.shuffle) toggleShuffle();
    setQueue(ids, 0);
    const shuffled = ids.slice().sort(() => Math.random() - 0.5);
    setQueue(shuffled, 0);
    playSong(shuffled[0]);
    return;
  }

  // Back
  if (e.target.closest('[data-back]')) {
    state.viewParam = null;
    render();
    return;
  }

  // Playlist rename / delete
  const renameBtn = e.target.closest('[data-renamepl]');
  if (renameBtn) {
    const pl = state.playlists.find(p => p.id === renameBtn.dataset.renamepl);
    if (!pl) return;
    promptDialog('Rename Playlist', pl.name, 'Rename').then(name => {
      if (!name) return;
      pl.name = name;
      saveState();
      render();
    });
    return;
  }
  const delBtn = e.target.closest('[data-deletepl]');
  if (delBtn) {
    const pl = state.playlists.find(p => p.id === delBtn.dataset.deletepl);
    if (!pl) return;
    confirmDialog('Delete Playlist', `Delete "${pl.name}"? This cannot be undone.`, 'Delete', true).then(ok => {
      if (!ok) return;
      state.playlists = state.playlists.filter(p => p.id !== pl.id);
      saveState();
      state.viewParam = null;
      render();
      toast('Playlist deleted');
    });
    return;
  }

  // Go-to links
  const goto = e.target.closest('[data-goto]');
  if (goto) {
    state.view = goto.dataset.goto;
    state.viewParam = null;
    render();
    return;
  }

  // Cards
  const albumCard = e.target.closest('[data-album]');
  if (albumCard) {
    state.view = 'albums';
    state.viewParam = albumCard.dataset.album;
    render();
    viewRoot.scrollTop = 0;
    return;
  }
  const artistCard = e.target.closest('[data-artist]');
  if (artistCard) {
    state.view = 'artists';
    state.viewParam = artistCard.dataset.artist;
    render();
    viewRoot.scrollTop = 0;
    return;
  }
  const plCard = e.target.closest('[data-playlist]');
  if (plCard) {
    state.view = 'playlists';
    state.viewParam = plCard.dataset.playlist;
    render();
    viewRoot.scrollTop = 0;
    return;
  }

  // Track / song card play
  const track = e.target.closest('[data-track]');
  if (track) {
    const id = track.dataset.id;
    const container = track.closest('[data-list]');
    if (container) {
      const ids = listRegistry.get(container.dataset.list) || [id];
      const idx = Math.max(0, ids.indexOf(id));
      setQueue(ids, idx);
      playSong(id);
    } else {
      const ids = state.library.map(s => s.id);
      const idx = Math.max(0, ids.indexOf(id));
      setQueue(ids, idx);
      playSong(id);
    }
    return;
  }
});

  if (e.key === 'Escape') {
    if (ctxMenuEl) { closeContextMenu(); return; }
    if (overlays.length) { closeTopOverlay(false); return; }
  }

  if (inField) return;

  switch (e.key) {
    case ' ':
    case 'Spacebar':
      if (!e.target.closest('[data-track],[data-album],[data-artist],[data-playlist],button')) {
        e.preventDefault();
        togglePlay();
      }
      break;
    case 'MediaPlayPause': e.preventDefault(); togglePlay(); break;
    case 'MediaTrackNext': e.preventDefault(); nextTrack(); break;
    case 'MediaTrackPrevious': e.preventDefault(); prevTrack(); break;
    case 'ArrowRight':
      if (e.shiftKey) { e.preventDefault(); seekBy(10); }
      break;
    case 'ArrowLeft':
      if (e.shiftKey) { e.preventDefault(); seekBy(-10); }
      break;
    case 'j': seekBy(-10); break;
    case 'l': seekBy(10); break;
    case 'k': togglePlay(); break;
  }
}, true);

document.addEventListener('mousedown', () => {
  document.documentElement.classList.remove('kbnav');
});

/* =====================================================================
   D-PAD / SPATIAL NAVIGATION (Android TV, Fire TV, keyboards)
   ===================================================================== */
function getFocusable() {
  const sel = 'button:not([disabled]), [tabindex]:not([tabindex="-1"]), input:not([disabled]), select:not([disabled]), a[href]';
  return Array.from(document.querySelectorAll(sel)).filter(el => {
    if (el.hasAttribute('hidden')) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return false;
    const cs = getComputedStyle(el);
    if (cs.visibility === 'hidden' || cs.display === 'none' || cs.opacity === '0') return false;
    return true;
  });
}

function spatialMove(direction) {
  const active = document.activeElement;
  if (!active || active === document.body) {
    const f = getFocusable();
    if (f.length) f[0].focus();
    return;
  }
  const aRect = active.getBoundingClientRect();
  const acx = aRect.left + aRect.width / 2;
  const acy = aRect.top + aRect.height / 2;

  let best = null, bestScore = Infinity;
  for (const el of getFocusable()) {
    if (el === active) continue;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = cx - acx;
    const dy = cy - acy;

    let primary, perp;
    if (direction === 'right') { if (dx < 6) continue; primary = dx; perp = Math.abs(dy); }
    else if (direction === 'left') { if (dx > -6) continue; primary = -dx; perp = Math.abs(dy); }
    else if (direction === 'down') { if (dy < 6) continue; primary = dy; perp = Math.abs(dx); }
    else { if (dy > -6) continue; primary = -dy; perp = Math.abs(dx); }

    const score = primary + perp * 2.6;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) {
    best.focus();
    try { best.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); } catch (e) { best.scrollIntoView(); }
  }
}

document.addEventListener('keydown', e => {
  const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  if (!keys.includes(e.key)) return;
  if (e.shiftKey) return;

  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.target.isContentEditable) return;

  const active = document.activeElement;
  const isFocusable = active && active !== document.body && active.matches('button, [tabindex]:not([tabindex="-1"]), a[href]');
  if (!isFocusable) return;  // let the browser scroll normally

  e.preventDefault();
  const dir = e.key === 'ArrowUp' ? 'up' : e.key === 'ArrowDown' ? 'down'
            : e.key === 'ArrowLeft' ? 'left' : 'right';
  spatialMove(dir);
});

/* =====================================================================
   MEDIA SESSION
   ===================================================================== */
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const s = player.current;
  try {
    if (!s) {
      navigator.mediaSession.metadata = null;
      return;
    }
    const artwork = [{ src: songArt(s), sizes: '512x512', type: 'image/jpeg' }];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title,
      artist: s.artist,
      album: s.album,
      artwork
    });
    if ('setPositionState' in navigator.mediaSession && isFinite(audio.duration) && audio.duration > 0) {
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate || 1,
          position: Math.min(audio.currentTime, audio.duration)
        });
      } catch (e) { /* ignore */ }
    }
  } catch (e) { /* ignore */ }
}

function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const handlers = {
    play: () => { audio.play().catch(() => {}); },
    pause: () => { audio.pause(); },
    previoustrack: () => prevTrack(),
    nexttrack: () => nextTrack(),
    seekbackward: (d) => seekBy(-(d.seekOffset || 10)),
    seekforward: (d) => seekBy(d.seekOffset || 10),
    seekto: (d) => { if (d.seekTime != null) seekTo(d.seekTime); },
    stop: () => { audio.pause(); audio.currentTime = 0; }
  };
  for (const [action, fn] of Object.entries(handlers)) {
    try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) { /* unsupported */ }
  }
  navigator.mediaSession.setPositionState && audio.addEventListener('timeupdate', debounce(() => {
    if (!player.current || !isFinite(audio.duration) || audio.duration <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate || 1,
        position: Math.min(audio.currentTime, audio.duration)
      });
    } catch (e) { /* ignore */ }
  }, 1000));
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function init() {
  setupMediaSession();

  const persisted = loadPersistedState();

  // Restore songs metadata from IndexedDB
  try {
    const songs = await dbGetAll('songs');
    state.library = songs.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    state.libraryReady = true;
  } catch (e) {
    console.error('[Pulse] failed to load library', e);
    toast('Could not read local library storage', 'error');
  }

  // Restore persisted app state
  if (persisted) {
    state.playlists = Array.isArray(persisted.playlists) ? persisted.playlists : [];
    state.favorites = new Set(Array.isArray(persisted.favorites) ? persisted.favorites : []);
    state.recent = Array.isArray(persisted.recent) ? persisted.recent : [];
    state.sort = persisted.sort || 'title';
    player.volume = typeof persisted.volume === 'number' ? persisted.volume : 1;
    player.muted = !!persisted.muted;
    player.shuffle = !!persisted.shuffle;
    player.repeat = ['off', 'one', 'all'].includes(persisted.repeat) ? persisted.repeat : 'off';
  }

  // Clean dangling references
  const libIds = new Set(state.library.map(s => s.id));
  state.favorites = new Set([...state.favorites].filter(id => libIds.has(id)));
  state.recent = state.recent.filter(id => libIds.has(id));
  state.playlists.forEach(p => { p.songIds = p.songIds.filter(id => libIds.has(id)); });

  $('#sortSelect').value = state.sort;
  audio.volume = player.volume;
  audio.muted = player.muted;

  // Restore queue / last song
  if (persisted && Array.isArray(persisted.queue) && persisted.queue.length) {
    const q = persisted.queue.filter(id => libIds.has(id));
    if (q.length) {
      player.queue = q;
      let idx = typeof persisted.queueIndex === 'number' ? persisted.queueIndex : 0;
      if (idx < 0 || idx >= q.length) idx = 0;
      player.index = idx;

      const curId = persisted.currentId && libIds.has(persisted.currentId) ? persisted.currentId : q[idx];
      const pos = persisted.position || 0;
      const ci = q.indexOf(curId);
      if (ci >= 0) player.index = ci;

      const song = songById(curId);
      if (song) {
        try {
          await loadSource(song);
          player.current = song;
          if (pos > 0 && isFinite(pos)) {
            const applyPos = () => {
              try { audio.currentTime = Math.min(pos, audio.duration || pos); } catch (e) { /* ignore */ }
              audio.removeEventListener('loadedmetadata', applyPos);
            };
            audio.addEventListener('loadedmetadata', applyPos);
          }
        } catch (e) { /* file missing */ }
      }
    }
  }

  render();
  renderQueuePanel();
  updatePlayerUI();
  updateStorageNote();

  // Warn about storage persistence
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(p => {
      if (!p) navigator.storage.persist().catch(() => {});
    }).catch(() => {});
  }
}

/* Keep the mini player from covering the last list items */
const styleTag = document.createElement('style');
styleTag.textContent = `.view { padding-bottom: calc(40px + var(--mini-h)); }`;
document.head.appendChild(styleTag);

init().catch(err => {
  console.error('[Pulse] init failed', err);
  toast('Startup error: ' + err.message, 'error');
});

})();
</script>
