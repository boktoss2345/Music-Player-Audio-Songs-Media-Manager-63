<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>Pulse Music</title>
<style>
/* ============================== THEME ============================== */
:root{
  --bg:#0a0b10;
  --surface:#151824;
  --surface-2:#1c2030;
  --surface-3:#252a3d;
  --line:rgba(255,255,255,.07);
  --text:#eef1f7;
  --muted:#9aa3b8;
  --muted-2:#6d768c;
  --accent:#7c5cff;
  --accent-2:#00d4b8;
  --danger:#ff5c7a;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --mini-h:74px;
  --sidebar-w:238px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1100px 700px at 15% -15%, #241b4d 0%, transparent 60%),
    radial-gradient(900px 600px at 105% 5%, #06393a 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img{display:block;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);}
::-webkit-scrollbar-track{background:transparent;}

/* Focus rings — visible for keyboard & D-pad navigation */
:focus{outline:none;}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:10px;}
html.kbnav :focus{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:10px;}

/* ============================== LAYOUT ============================== */
.app{display:flex;height:100dvh;overflow:hidden;}

/* ---- Sidebar ---- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  display:flex;flex-direction:column;
  background:rgba(10,12,20,.72);
  backdrop-filter:blur(18px);
  border-right:1px solid var(--line);
  z-index:60;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 14px;}
.brand-logo{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.4);
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.4px;}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px;overflow-y:auto;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;border-radius:12px;
  color:var(--muted);font-size:14.5px;font-weight:600;
  transition:background .16s,color .16s;
  text-align:left;width:100%;
}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex:0 0 20px;}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
.nav-item.active{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(0,212,184,.08));color:#fff;}
.nav-item.active svg{fill:var(--accent-2);}
.side-bottom{padding:14px;border-top:1px solid var(--line);}
.storage-note{font-size:11px;color:var(--muted-2);margin-top:10px;line-height:1.5;}

/* ---- Buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;
  background:var(--surface-3);color:var(--text);
  transition:transform .12s,background .16s,box-shadow .16s;white-space:nowrap;
}
.btn:hover{background:#2f3550;}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff;box-shadow:0 6px 22px rgba(124,92,255,.35);}
.btn.primary:hover{box-shadow:0 8px 28px rgba(124,92,255,.5);}
.btn.ghost{background:transparent;border:1px solid var(--line);}
.btn.ghost:hover{background:rgba(255,255,255,.06);}
.btn.block{width:100%;}
.btn.danger{background:rgba(255,92,122,.15);color:var(--danger);}
.btn.danger:hover{background:rgba(255,92,122,.25);}

.icon-btn{
  display:grid;place-items:center;width:40px;height:40px;border-radius:50%;
  color:var(--muted);transition:background .16s,color .16s,transform .12s;flex:0 0 auto;
}
.icon-btn svg{width:20px;height:20px;fill:currentColor;pointer-events:none;}
.icon-btn:hover{background:rgba(255,255,255,.09);color:var(--text);}
.icon-btn:active{transform:scale(.92);}
.icon-btn.on{color:var(--accent-2);}
.icon-btn.on.heart{color:var(--danger);}
.icon-btn.heart.on{color:var(--danger);}
.icon-btn.big{width:52px;height:52px;}
.icon-btn.big svg{width:26px;height:26px;}

/* ---- Main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 22px;flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:rgba(10,12,20,.55);backdrop-filter:blur(14px);z-index:20;
}
.search{position:relative;flex:1;max-width:560px;display:flex;align-items:center;}
.search svg{position:absolute;left:14px;width:18px;height:18px;fill:var(--muted-2);pointer-events:none;}
.search input{
  width:100%;padding:11px 40px 11px 42px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:14px;
  transition:border-color .16s,background .16s;
}
.search input::placeholder{color:var(--muted-2);}
.search input:focus{border-color:var(--accent);background:var(--surface-2);outline:none;}
.clear-btn{position:absolute;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);}
.clear-btn:hover{background:rgba(255,255,255,.1);}
.select{
  padding:11px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;
}
.select:focus{border-color:var(--accent);outline:none;}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 22px 40px;scroll-behavior:smooth;}

/* ============================== VIEW PARTS ============================== */
.section{margin-bottom:34px;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;}
.section-title{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:0;}
.section-sub{font-size:13px;color:var(--muted-2);margin-top:4px;}
.page-title{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:0 0 6px;}

.hero{
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding:28px;border-radius:var(--r-xl);margin-bottom:34px;
  background:linear-gradient(120deg,rgba(124,92,255,.28),rgba(0,212,184,.14));
  border:1px solid rgba(255,255,255,.08);
}
.hero h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.8px;}
.hero p{margin:0;color:rgba(255,255,255,.7);font-size:14px;max-width:520px;line-height:1.6;}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;}
.stat b{display:block;font-size:24px;font-weight:800;}
.stat span{font-size:11.5px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.8px;font-weight:700;}

/* ---- Horizontal card rail ---- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;}
.rail::-webkit-scrollbar{height:8px;}

.card{
  border-radius:var(--r-md);padding:10px;background:transparent;
  transition:background .18s,transform .18s;text-align:left;width:100%;
  scroll-snap-align:start;
}
.card:hover{background:rgba(255,255,255,.06);}
.card:active{transform:scale(.98);}
.card-art{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
  background:var(--surface-2);margin-bottom:10px;box-shadow:0 10px 26px rgba(0,0,0,.4);
}
.card-art img{width:100%;height:100%;object-fit:cover;}
.card.round .card-art{border-radius:50%;}
.card-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{font-size:12px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}

/* ---- Track list ---- */
.tracklist{display:flex;flex-direction:column;gap:2px;}
.track{
  display:grid;grid-template-columns:46px 1fr 92px 84px;
  align-items:center;gap:14px;padding:8px 12px;border-radius:12px;
  cursor:pointer;transition:background .14s;
}
.track:hover{background:rgba(255,255,255,.055);}
.track.current{background:rgba(124,92,255,.16);}
.track.current .track-title{color:var(--accent-2);}
.track-art{width:46px;height:46px;border-radius:9px;overflow:hidden;background:var(--surface-2);flex:0 0 auto;}
.track-art img{width:100%;height:100%;object-fit:cover;}
.track-main{min-width:0;}
.track-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-sub{font-size:12.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.track-album{font-size:12.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-end{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.track-dur{font-size:12.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;min-width:38px;text-align:right;}
.track-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;}
.track:hover .track-actions,.track:focus-within .track-actions{opacity:1;}
@media (hover:none){.track-actions{opacity:1;}}

/* ---- Empty state ---- */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:70px 24px;color:var(--muted);
}
.empty-icon{
  width:88px;height:88px;border-radius:26px;display:grid;place-items:center;margin-bottom:22px;
  background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(0,212,184,.12));
}
.empty-icon svg{width:42px;height:42px;fill:var(--accent-2);}
.empty h3{margin:0 0 8px;font-size:20px;color:var(--text);font-weight:800;}
.empty p{margin:0 0 22px;font-size:14px;max-width:420px;line-height:1.65;}

/* ============================== MINI PLAYER ============================== */
.miniplayer{
  position:fixed;left:0;right:0;bottom:0;height:var(--mini-h);
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:rgba(16,19,30,.9);backdrop-filter:blur(22px);
  border-top:1px solid var(--line);z-index:70;
  transform:translateY(110%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.miniplayer.show{transform:translateY(0);}
.mini-progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.09);cursor:pointer;}
.mini-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .1s linear;}
.mini-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1;cursor:pointer;background:none;padding:4px;border-radius:12px;}
.mini-info:hover{background:rgba(255,255,255,.05);}
.mini-art{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--surface-2);flex:0 0 auto;}
.mini-art img{width:100%;height:100%;object-fit:cover;}
.mini-text{min-width:0;}
.mini-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:12px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.mini-controls{display:flex;align-items:center;gap:4px;}
.mini-right{display:flex;align-items:center;gap:10px;}
.mini-vol{width:110px;}

/* ============================== RANGE INPUTS ============================== */
input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%;height:22px;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(255,255,255,.16);}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;
  margin-top:-4.5px;box-shadow:0 1px 5px rgba(0,0,0,.5);transition:transform .12s;
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18);}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.16);}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff;}
.seek{--p:0%;}
.seek::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,var(--accent-2) var(--p),rgba(255,255,255,.16) var(--p));
}

/* ============================== NOW PLAYING ============================== */
.nowplaying{
  position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);
  visibility:hidden;
}
.nowplaying.open{transform:translateY(0);visibility:visible;}
.np-bg{
  position:absolute;inset:-20%;background-size:cover;background-position:center;
  filter:blur(70px) saturate(1.6);opacity:.32;transform:scale(1.15);transition:background-image .4s;
}
.np-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,16,.35),var(--bg) 78%);}
.np-inner{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;max-width:640px;width:100%;margin:0 auto;padding:14px 24px 26px;}
.np-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;}
.np-head-title{font-size:12.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
.np-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0;padding:8px 0;}
.np-art{
  width:100%;max-width:min(360px,52vh);aspect-ratio:1/1;margin:0 auto;
  border-radius:var(--r-xl);overflow:hidden;background:var(--surface-2);
  box-shadow:0 30px 80px rgba(0,0,0,.65);flex:0 1 auto;
}
.np-art img{width:100%;height:100%;object-fit:cover;}
.np-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.np-title{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.25;}
.np-artist{font-size:15px;color:var(--accent-2);font-weight:600;margin-top:5px;}
.np-album{font-size:13px;color:var(--muted-2);margin-top:3px;}
.np-progress{display:flex;flex-direction:column;gap:2px;}
.np-times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted-2);font-variant-numeric:tabular-nums;}
.np-controls{display:flex;align-items:center;justify-content:center;gap:14px;}
.play-btn{
  width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:#fff;color:#0a0b10;box-shadow:0 10px 34px rgba(255,255,255,.22);
  transition:transform .14s;
}
.play-btn svg{width:30px;height:30px;fill:currentColor;pointer-events:none;}
.play-btn:hover{transform:scale(1.06);}
.play-btn:active{transform:scale(.96);}
.play-btn:disabled{opacity:.4;cursor:not-allowed;}
.np-volume{display:flex;align-items:center;gap:12px;}
.np-volume input{flex:1;}

/* ============================== QUEUE PANEL ============================== */
.queue-panel{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:130;
  display:flex;flex-direction:column;
  background:rgba(16,19,30,.97);backdrop-filter:blur(22px);
  border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  visibility:hidden;
}
.queue-panel.open{transform:translateX(0);visibility:visible;}
.qp-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;border-bottom:1px solid var(--line);}
.qp-head h3{margin:0;font-size:16px;font-weight:800;}
.qp-list{flex:1;overflow-y:auto;padding:10px;}
.qp-item{
  display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;
  padding:7px 9px;border-radius:10px;cursor:pointer;
}
.qp-item:hover{background:rgba(255,255,255,.06);}
.qp-item.current{background:rgba(124,92,255,.18);}
.qp-art{width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--surface-2);}
.qp-art img{width:100%;height:100%;object-fit:cover;}
.qp-meta{min-width:0;}
.qp-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qp-sub{font-size:11.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qp-actions{display:flex;gap:0;}
.qp-actions .icon-btn{width:32px;height:32px;}
.qp-actions .icon-btn svg{width:16px;height:16px;}
.qp-foot{padding:12px;border-top:1px solid var(--line);}

/* ============================== MODAL ============================== */
.modal-root{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-root.open{display:flex;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);animation:fadeIn .2s;}
.modal{
  position:relative;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:popIn .22s cubic-bezier(.34,1.4,.64,1);overflow:hidden;
}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(12px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal h3{margin:0;padding:20px 22px 12px;font-size:17px;font-weight:800;}
.modal-body{padding:0 22px 8px;overflow-y:auto;flex:1;}
.modal-body p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.6;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px;}
.text-input{
  width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text);font-size:15px;
}
.text-input:focus{border-color:var(--accent);outline:none;}
.pick-row{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;width:100%;
  text-align:left;transition:background .14s;
}
.pick-row:hover{background:rgba(255,255,255,.07);}
.pick-row .dot{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);flex:0 0 auto;font-size:18px;}
.pick-row .nm{font-weight:700;font-size:14px;}
.pick-row .ct{font-size:12px;color:var(--muted-2);}

/* ============================== CONTEXT MENU ============================== */
.ctx-menu{
  position:fixed;z-index:300;min-width:216px;padding:7px;border-radius:14px;
  background:rgba(28,32,48,.98);backdrop-filter:blur(20px);
  border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.6);
  animation:popIn .14s ease-out;max-height:70vh;overflow-y:auto;
}
.ctx-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:var(--text);text-align:left;
}
.ctx-item:hover,.ctx-item:focus{background:rgba(255,255,255,.1);}
.ctx-item svg{width:17px;height:17px;fill:var(--muted);flex:0 0 17px;}
.ctx-item.danger{color:var(--danger);}
.ctx-item.danger svg{fill:var(--danger);}
.ctx-sep{height:1px;background:var(--line);margin:6px 8px;}

/* ============================== TOAST ============================== */
.toast-root{position:fixed;left:50%;bottom:calc(var(--mini-h) + 18px);transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.toast{
  padding:12px 18px;border-radius:12px;background:rgba(37,42,61,.97);backdrop-filter:blur(12px);
  border:1px solid var(--line);font-size:13.5px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.5);
  animation:toastIn .24s cubic-bezier(.34,1.4,.64,1);max-width:100%;text-align:center;
}
.toast.error{background:rgba(80,25,42,.97);border-color:rgba(255,92,122,.35);}
.toast.out{animation:toastOut .3s forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.96);}}

/* ============================== SPINNER ============================== */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================== SCROLLBAR / CHIPS ============================== */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip{padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);}
.chip.on{background:rgba(124,92,255,.25);color:#fff;border-color:transparent;}

/* ============================== RESPONSIVE ============================== */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;}
.only-mobile{display:none;}

@media (max-width:900px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .scrim.show{display:block;}
  .only-mobile{display:grid;}
  .only-desktop{display:none;}
  .view{padding:18px 14px 40px;}
  .topbar{padding:10px 14px;gap:8px;}
  .page-title{font-size:26px;}
  .hero{padding:20px;}
  .hero h1{font-size:24px;}
  .track{grid-template-columns:44px 1fr 40px;gap:10px;padding:7px 8px;}
  .track-album{display:none;}
  .track-end{display:none;}
  .mini-vol{display:none;}
  .miniplayer{padding:0 10px;gap:8px;}
  .rail{grid-auto-columns:132px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;}
}
@media (max-width:560px){
  .track-dur{display:none;}
  .track{grid-template-columns:44px 1fr auto;}
}
/* Short screens (TV landscape) */
@media (max-height:520px){
  .np-art{max-width:min(240px,34vh);}
  .np-body{gap:14px;}
  .play-btn{width:58px;height:58px;}
  .np-title{font-size:19px;}
}
/* Android TV / Fire TV: larger hit targets */
@media (min-width:960px) and (pointer:coarse){
  .icon-btn{width:46px;height:46px;}
  .icon-btn svg{width:23px;height:23px;}
  .nav-item{padding:14px 16px;font-size:15.5px;}
  .track{padding:11px 14px;}
}
</style>

<script>
"use strict";
/* =====================================================================
   PULSE MUSIC — real local music player
   Sections:
     1.  Utilities
     2.  IndexedDB layer
     3.  Audio metadata parsers (ID3v2 / FLAC / MP4-M4A / WAV)
     4.  Application state + persistence
     5.  Playback engine
     6.  UI rendering
     7.  Event wiring
     8.  Media Session, D-pad navigation, boot
   ===================================================================== */
(function () {

/* =====================================================================
   1. UTILITIES
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return h
    ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
    : `${m}:${String(s).padStart(2, '0')}`;
}

const PLACEHOLDER_ART = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
     <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d4b8"/>
     </linearGradient></defs>
     <rect width="120" height="120" fill="url(#g)"/>
     <path d="M76 30v40.4a14 14 0 1 1-8-12.6V42l-24 5v33.4a14 14 0 1 1-8-12.6V37z"
           fill="rgba(255,255,255,.92)"/>
   </svg>`
);

function toast(msg, type) {
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 3400);
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* =====================================================================
   2. INDEXEDDB LAYER
   ===================================================================== */
const DB_NAME = 'pulse-music';
const DB_VER = 1;
let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

function idbReq(req) {
  return new Promise((res, rej) => {
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function dbPut(store, value, key) {
  const db = await openDB();
  const tx = db.transaction(store, 'readwrite');
  const req = key === undefined ? tx.objectStore(store).put(value)
                                : tx.objectStore(store).put(value, key);
  return idbReq(req);
}
async function dbGet(store, key) {
  const db = await openDB();
  return idbReq(db.transaction(store, 'readonly').objectStore(store).get(key));
}
async function dbGetAll(store) {
  const db = await openDB();
  return idbReq(db.transaction(store, 'readonly').objectStore(store).getAll());
}
async function dbDelete(store, key) {
  const db = await openDB();
  return idbReq(db.transaction(store, 'readwrite').objectStore(store).delete(key));
}
async function dbClear(store) {
  const db = await openDB();
  return idbReq(db.transaction(store, 'readwrite').objectStore(store).clear());
}

/* =====================================================================
   3. AUDIO METADATA PARSERS
   ===================================================================== */
const readU32BE = (u8, o) => (((u8[o] << 24) | (u8[o + 1] << 16) | (u8[o + 2] << 8) | u8[o + 3]) >>> 0);
const readU32LE = (u8, o) => ((u8[o] | (u8[o + 1] << 8) | (u8[o + 2] << 16) | (u8[o + 3] << 24)) >>> 0);
const readU64BE = (u8, o) => readU32BE(u8, o) * 4294967296 + readU32BE(u8, o + 4);
const syncsafe  = (u8, o) => ((u8[o] & 0x7f) << 21) | ((u8[o + 1] & 0x7f) << 14) | ((u8[o + 2] & 0x7f) << 7) | (u8[o + 3] & 0x7f);

function latin1(u8, off, len) {
  let s = '';
  for (let i = 0; i < len; i++) s += String.fromCharCode(u8[off + i]);
  return s;
}

function deunsync(u8) {
  const out = new Uint8Array(u8.length);
  let j = 0;
  for (let i = 0; i < u8.length; i++) {
    out[j++] = u8[i];
    if (u8[i] === 0xFF && i + 1 < u8.length && u8[i + 1] === 0x00) i++;
  }
  return out.subarray(0, j);
}

function decodeTextFrame(u8) {
  if (!u8 || u8.length === 0) return '';
  const enc = u8[0];
  const bytes = u8.subarray(1);
  let s = '';
  try {
    if (enc === 0) s = new TextDecoder('iso-8859-1').decode(bytes);
    else if (enc === 1) {
      if (bytes[0] === 0xFF && bytes[1] === 0xFE) s = new TextDecoder('utf-16le').decode(bytes.subarray(2));
      else if (bytes[0] === 0xFE && bytes[1] === 0xFF) s = new TextDecoder('utf-16be').decode(bytes.subarray(2));
      else s = new TextDecoder('utf-16le').decode(bytes);
    }
    else if (enc === 2) s = new TextDecoder('utf-16be').decode(bytes);
    else s = new TextDecoder('utf-8').decode(bytes);
  } catch (e) { s = ''; }
  return s.replace(/\u0000+$/g, '').replace(/\u0000/g, '').trim();
}

/* ---------- ID3v2 (MP3) ---------- */
async function parseID3(file, meta, artOut) {
  const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
  const ver = head[3];
  const flags = head[5];
  const tagSize = syncsafe(head, 6);
  if (tagSize <= 0) return;
  const want = Math.min(10 + tagSize, file.size, 14 * 1024 * 1024);
  const buf = new Uint8Array(await file.slice(0, want).arrayBuffer());
  let body = buf.subarray(10, Math.min(10 + tagSize, buf.length));
  if (flags & 0x80) body = deunsync(body);

  let p = 0;
  if (flags & 0x40) { // extended header
    if (ver === 3) p = 4 + readU32BE(body, 0);
    else if (ver === 4) p = syncsafe(body, 0);
  }

  const frames = [];
  if (ver === 2) {
    while (p + 6 <= body.length) {
      const id = latin1(body, p, 3);
      if (!/^[A-Z0-9]{3}$/.test(id)) break;
      const fs = (body[p + 3] << 16) | (body[p + 4] << 8) | body[p + 5];
      if (fs <= 0 || p + 6 + fs > body.length) break;
      frames.push({ id, data: body.subarray(p + 6, p + 6 + fs) });
      p += 6 + fs;
    }
  } else {
    while (p + 10 <= body.length) {
      const id = latin1(body, p, 4);
      if (!/^[A-Z0-9]{4}$/.test(id)) break;
      const fs = ver === 4 ? syncsafe(body, p + 4) : readU32BE(body, p + 4);
      const fmt = body[p + 9];
      if (fs <= 0 || p + 10 + fs > body.length) break;
      let data = body.subarray(p + 10, p + 10 + fs);
      const compressed = ver === 4 ? (fmt & 0x08) : (fmt & 0x80);
      const encrypted  = ver === 4 ? (fmt & 0x04) : (fmt & 0x40);
      if (!compressed && !encrypted) {
        if (ver === 4 && (fmt & 0x02)) data = deunsync(data);
        if (ver === 4 && (fmt & 0x01)) data = data.subarray(4);
        frames.push({ id, data });
      }
      p += 10 + fs;
    }
  }

  const map = { TT2: 'title', TIT2: 'title', TP1: 'artist', TPE1: 'artist', TAL: 'album', TALB: 'album' };
  for (const f of frames) {
    const key = map[f.id];
    if (key) {
      const val = decodeTextFrame(f.data);
      if (val) meta[key] = val;
    } else if ((f.id === 'APIC' || f.id === 'PIC') && !artOut.blob) {
      try {
        const d = f.data;
        const enc = d[0];
        let q = 1, mime;
        if (f.id === 'PIC') { mime = 'image/' + latin1(d, q, 3).toLowerCase(); q += 3; }
        else {
          let e = q; while (e < d.length && d[e] !== 0) e++;
          mime = latin1(d, q, e - q) || 'image/jpeg';
          q = e + 1;
        }
        q++; // picture type
        if (enc === 0 || enc === 3) { while (q < d.length && d[q] !== 0) q++; q++; }
        else { while (q + 1 < d.length && !(d[q] === 0 && d[q + 1] === 0)) q += 2; q += 2; }
        const img = d.subarray(q);
        if (img.length > 64) artOut.blob = new Blob([img], { type: mime.split(';')[0] });
      } catch (e) { /* ignore malformed artwork */ }
    }
  }
}

/* ---------- FLAC ---------- */
function parseVorbisComment(u8, meta) {
  let p = 0;
  const vendorLen = readU32LE(u8, p); p += 4 + vendorLen;
  const count = readU32LE(u8, p); p += 4;
  for (let i = 0; i < count && p + 4 <= u8.length; i++) {
    const len = readU32LE(u8, p); p += 4;
    if (p + len > u8.length) break;
    const kv = new TextDecoder('utf-8').decode(u8.subarray(p, p + len));
    p += len;
    const eq = kv.indexOf('=');
    if (eq < 0) continue;
    const key = kv.slice(0, eq).toUpperCase();
    const val = kv.slice(eq + 1).trim();
    if (!val) continue;
    if (key === 'TITLE' && !meta.title) meta.title = val;
    else if (key === 'ARTIST' && !meta.artist) meta.artist = val;
    else if (key === 'ALBUM' && !meta.album) meta.album = val;
  }
}

async function parseFLAC(file, meta, artOut) {
  const buf = new Uint8Array(await file.slice(0, Math.min(file.size, 6 * 1024 * 1024)).arrayBuffer());
  if (latin1(buf, 0, 4) !== 'fLaC') return;
  let p = 4;
  while (p + 4 <= buf.length) {
    const header = buf[p];
    const last = header & 0x80;
    const type = header & 0x7f;
    const len = (buf[p + 1] << 16) | (buf[p + 2] << 8) | buf[p + 3];
    const start = p + 4;
    const end = start + len;
    if (end > buf.length) break;
    if (type === 4) parseVorbisComment(buf.subarray(start, end), meta);
    else if (type === 6 && !artOut.blob) {
      try {
        let q = start;
        q += 4; // picture type
        const mimeLen = readU32BE(buf, q); q += 4;
        const mime = latin1(buf, q, mimeLen); q += mimeLen;
        const descLen = readU32BE(buf, q); q += 4 + descLen;
        q += 16; // width, height, depth, colors
        const dataLen = readU32BE(buf, q); q += 4;
        if (dataLen > 0 && q + dataLen <= end) {
          artOut.blob = new Blob([buf.subarray(q, q + dataLen)], { type: mime || 'image/jpeg' });
        }
      } catch (e) { /* ignore */ }
    }
    if (last) break;
    p = end;
  }
}

/* ---------- MP4 / M4A / AAC ---------- */
async function parseMP4(file, meta, artOut) {
  let buf;
  if (file.size <= 64 * 1024 * 1024) buf = new Uint8Array(await file.arrayBuffer());
  else buf = new Uint8Array(await file.slice(0, 12 * 1024 * 1024).arrayBuffer());

  const items = [];

  function parseIlst(s, e) {
    let p = s;
    while (p + 8 <= e) {
      const size = readU32BE(buf, p);
      const name = latin1(buf, p + 4, 4);
      if (size < 8 || p + size > e) break;
      let q = p + 8;
      while (q + 8 <= p + size) {
        const dsize = readU32BE(buf, q);
        const dtype = latin1(buf, q + 4, 4);
        if (dsize < 8) break;
        if (dtype === 'data' && q + 16 <= p + size) {
          const wkt = readU32BE(buf, q + 8) & 0xFFFFFF;
          items.push({ name, wkt, payload: buf.subarray(q + 16, Math.min(q + dsize, p + size)) });
        }
        q += dsize;
      }
      p += size;
    }
  }

  function walk(start, end) {
    let p = start;
    while (p + 8 <= end) {
      let size = readU32BE(buf, p);
      const type = latin1(buf, p + 4, 4);
      let hs = 8;
      if (size === 1) { size = readU64BE(buf, p + 8); hs = 16; }
      else if (size === 0) size = end - p;
      if (size < hs) return;
      const cs = p + hs, ce = Math.min(p + size, end);
      if (type === 'moov' || type === 'udta' || type === 'trak' || type === 'mdia' ||
          type === 'minf' || type === 'stbl') {
        walk(cs, ce);
      } else if (type === 'meta') {
        walk(cs + 4, ce);
      } else if (type === 'ilst') {
        parseIlst(cs, ce);
      }
      p += size;
    }
  }

  walk(0, buf.length);

  for (const it of items) {
    if (it.name === '\u00A9nam' && it.wkt === 1) meta.title = new TextDecoder('utf-8').decode(it.payload).trim();
    else if (it.name === '\u00A9ART' && it.wkt === 1) meta.artist = new TextDecoder('utf-8').decode(it.payload).trim();
    else if (it.name === '\u00A9alb' && it.wkt === 1) meta.album = new TextDecoder('utf-8').decode(it.payload).trim();
    else if (it.name === 'covr' && !artOut.blob) {
      const type = it.wkt === 14 ? 'image/png' : 'image/jpeg';
      if (it.payload.length > 64) artOut.blob = new Blob([it.payload], { type });
    }
  }
}

/* ---------- WAV (RIFF INFO chunk) ---------- */
async function parseWAV(file, meta) {
  const buf = new Uint8Array(await file.slice(0, Math.min(file.size, 2 * 1024 * 1024)).arrayBuffer());
  if (latin1(buf, 0, 4) !== 'RIFF') return;
  let p = 12;
  while (p + 8 <= buf.length) {
    const id = latin1(buf, p, 4);
    const size = readU32LE(buf, p + 4);
    if (size < 0 || p + 8 + size > buf.length) break;
    if (id === 'LIST' && latin1(buf, p + 8, 4) === 'INFO') {
      let q = p + 12;
      const end = p + 8 + size;
      while (q + 8 <= end) {
        const sub = latin1(buf, q, 4);
        const subSize = readU32LE(buf, q + 4);
        if (q + 8 + subSize > end) break;
        const val = new TextDecoder('utf-8').decode(buf.subarray(q + 8, q + 8 + subSize)).replace(/\0+$/, '').trim();
        if (sub === 'INAM' && val) meta.title = val;
        else if (sub === 'IART' && val) meta.artist = val;
        else if (sub === 'IPRD' && val) meta.album = val;
        q += 8 + subSize + (subSize % 2);
      }
    }
    p += 8 + size + (size % 2);
  }
}

/* ---------- Artwork helpers ---------- */
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}

async function shrinkImage(blob, max = 512) {
  try {
    const url = URL.createObjectURL(blob);
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = url;
    });
    const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
    const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    return canvas.toDataURL('image/jpeg', 0.85);
  } catch (e) {
    try { return await blobToDataURL(blob); } catch (e2) { return null; }
  }
}

/* ---------- Duration detection ---------- */
function detectDuration(file) {
  return new Promise(resolve => {
    const a = document.createElement('audio');
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      URL.revokeObjectURL(url);
      a.removeAttribute('src');
      a.load();
      resolve(isFinite(v) && v > 0 ? v : 0);
    };
    const timer = setTimeout(() => finish(a.duration), 9000);
    a.preload = 'metadata';
    a.onloadedmetadata = () => { clearTimeout(timer); finish(a.duration); };
    a.onerror = () => { clearTimeout(timer); finish(0); };
    a.src = url;
  });
}

/* ---------- Master metadata extractor ---------- */
async function extractMetadata(file) {
  const meta = { title: '', artist: '', album: '', duration: 0, artwork: null };
  const artOut = { blob: null };

  const baseName = file.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  try {
    const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
    const sig4 = latin1(head, 0, 4);
    if (sig4.startsWith('ID3')) await parseID3(file, meta, artOut);
    else if (sig4 === 'fLaC') await parseFLAC(file, meta, artOut);
    else if (sig4 === 'RIFF') await parseWAV(file, meta);
    else if (latin1(head, 4, 4) === 'ftyp') await parseMP4(file, meta, artOut);
  } catch (err) {
    console.warn('[Pulse] metadata parse failed for', file.name, err);
  }

  if (!meta.title) {
    // Try "Artist - Title" pattern from filename
    const dash = baseName.match(/^(.{1,60}?)\s+[-–—]\s+(.{1,80})$/);
    if (dash && !meta.artist) { meta.artist = dash[1].trim(); meta.title = dash[2].trim(); }
    else meta.title = baseName || 'Unknown Title';
  }
  if (!meta.artist) meta.artist = 'Unknown Artist';
  if (!meta.album) meta.album = 'Unknown Album';

  if (artOut.blob) {
    try { meta.artwork = await shrinkImage(artOut.blob, 512); } catch (e) { meta.artwork = null; }
  }

  meta.duration = await detectDuration(file);
  return meta;
}

/* =====================================================================
   4. STATE + PERSISTENCE
   ===================================================================== */
const STORAGE_KEY = 'pulse.state.v1';

const state = {
  library: [],            // array of song objects
  playlists: [],          // [{id, name, songIds:[]}]
  favorites: new Set(),   // song ids
  recent: [],             // song ids, newest first
  view: 'home',
  viewParam: null,
  search: '',
  sort: 'title',
  libraryReady: false
};

const listRegistry = new Map();  // key -> array of song ids (for play-context)

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      playlists: state.playlists,
      favorites: [...state.favorites],
      recent: state.recent,
      sort: state.sort,
      queue: player.queue,
      queueIndex: player.index,
      currentId: player.current ? player.current.id : null,
      position: player.current ? player.audio.currentTime : 0,
      volume: player.volume,
      muted: player.muted,
      shuffle: player.shuffle,
      repeat: player.repeat
    }));
  } catch (e) { /* quota or private mode — non-fatal */ }
}
const saveStateDebounced = debounce(saveState, 400);

function loadPersistedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

/* =====================================================================
   5. PLAYBACK ENGINE
   ===================================================================== */
const audio = $('#audio');

const player = {
  audio,
  current: null,
  queue: [],          // song ids
  index: -1,
  shuffle: false,
  repeat: 'off',      // 'off' | 'one' | 'all'
  volume: 1,
  muted: false,
  loading: false,
  objectUrl: null,
  _preShuffleQueue: null,
  _preShuffleIndex: -1
};

function songById(id) {
  return state.library.find(s => s.id === id) || null;
}

function songTitle(s) { return s ? s.title : 'Nothing playing'; }
function songArtist(s) { return s ? s.artist : '—'; }
function songArt(s) { return (s && s.artwork) ? s.artwork : PLACEHOLDER_ART; }

/* ---- Source loading ---- */
async function loadSource(song) {
  if (player.objectUrl) { URL.revokeObjectURL(player.objectUrl); player.objectUrl = null; }
  let blob = await dbGet('files', song.id);
  if (!blob) {
    // The user may have re-imported the file this session; check nothing else we can do.
    throw new Error('Audio file is no longer available in local storage.');
  }
  player.objectUrl = URL.createObjectURL(blob);
  audio.src = player.objectUrl;
  audio.load();
}

/* ---- Core play ---- */
async function playSong(songId, opts = {}) {
  const song = songById(songId);
  if (!song) { toast('Song not found', 'error'); return; }

  const sameSong = player.current && player.current.id === songId;
  if (!sameSong) {
    player.loading = true;
    updatePlayerUI();
    try {
      player.current = song;
    } catch (e) { /* noop */ }
    try {
      await loadSource(song);
    } catch (err) {
      player.loading = false;
      player.current = null;
      updatePlayerUI();
      toast(err.message || 'Could not load this file', 'error');
      return;
    }
    player.loading = false;
    pushRecent(songId);
    if (opts.position) {
      try { audio.currentTime = opts.position; } catch (e) { /* noop */ }
    }
  }

  if (opts.autoplay !== false) {
    try {
      await audio.play();
    } catch (err) {
      if (err && err.name !== 'AbortError') {
        toast('Playback could not start: ' + (err.message || err.name), 'error');
      }
    }
  }
  updatePlayerUI();
  refreshTrackHighlight();
  saveStateDebounced();
}

/* ---- Transport ---- */
function togglePlay() {
  if (!player.current) {
    // Start the first song in the library
    if (state.library.length) {
      player.queue = state.library.map(s => s.id);
      player.index = 0;
      playSong(player.queue[0]);
      renderQueuePanel();
    } else {
      toast('Import some music first');
    }
    return;
  }
  if (audio.paused) audio.play().catch(e => toast('Playback error: ' + e.message, 'error'));
  else audio.pause();
}

function nextTrack(auto = false) {
  if (!player.queue.length) return;
  if (player.repeat === 'one' && auto) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  let ni = player.index + 1;
  if (ni >= player.queue.length) {
    if (player.repeat === 'all') ni = 0;
    else {
      if (auto) { audio.pause(); audio.currentTime = 0; updatePlayerUI(); }
      else { ni = 0; }
      if (player.repeat === 'off' && auto) return;
    }
  }
  if (player.shuffle && player.queue.length > 1) {
    let r;
    do { r = Math.floor(Math.random() * player.queue.length); } while (r === player.index && player.queue.length > 1);
    ni = r;
  }
  player.index = ni;
  playSong(player.queue[ni]);
  renderQueuePanel();
}

function prevTrack() {
  if (!player.queue.length) return;
  // Restart current song if we're more than 3 seconds in
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let pi = player.index - 1;
  if (pi < 0) pi = player.repeat === 'all' ? player.queue.length - 1 : 0;
  player.index = pi;
  playSong(player.queue[pi]);
  renderQueuePanel();
}

function seekTo(seconds) {
  if (!player.current || !isFinite(audio.duration)) return;
  audio.currentTime = clamp(seconds, 0, audio.duration);
}

function seekBy(delta) {
  if (!player.current) return;
  audio.currentTime = clamp(audio.currentTime + delta, 0, audio.duration || 0);
}

function setVolume(v) {
  player.volume = clamp(v, 0, 1);
  audio.volume = player.volume;
  if (player.volume > 0) player.muted = false;
  audio.muted = player.muted;
  updateVolumeUI();
  saveStateDebounced();
}

function toggleMute() {
  player.muted = !player.muted;
  audio.muted = player.muted;
  updateVolumeUI();
  saveStateDebounced();
}

function toggleShuffle() {
  player.shuffle = !player.shuffle;
  if (player.shuffle) {
    player._preShuffleQueue = player.queue.slice();
    player._preShuffleIndex = player.index;
    const cur = player.index >= 0 ? player.queue[player.index] : null;
    const rest = player.queue.filter((_, i) => i !== player.index);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    player.queue = cur ? [cur, ...rest] : rest;
    player.index = cur ? 0 : -1;
  } else if (player._preShuffleQueue) {
    const curId = player.index >= 0 ? player.queue[player.index] : null;
    player.queue = player._preShuffleQueue.slice();
    const ni = curId ? player.queue.indexOf(curId) : -1;
    player.index = ni >= 0 ? ni : player._preShuffleIndex;
    player._preShuffleQueue = null;
  }
  updatePlayerUI();
  renderQueuePanel();
  saveStateDebounced();
}

function cycleRepeat() {
  player.repeat = player.repeat === 'off' ? 'all' : player.repeat === 'all' ? 'one' : 'off';
  updatePlayerUI();
  saveStateDebounced();
  toast('Repeat: ' + (player.repeat === 'off' ? 'Off' : player.repeat === 'all' ? 'All' : 'One'));
}

/* ---- Queue management ---- */
function setQueue(ids, startIndex = 0) {
  player.queue = ids.slice();
  player.index = startIndex;
  player._preShuffleQueue = null;
  renderQueuePanel();
  saveStateDebounced();
}

function addToQueue(songId) {
  if (!songById(songId)) return;
  player.queue.push(songId);
  if (player.index < 0) player.index = 0;
  renderQueuePanel();
  saveStateDebounced();
  toast('Added to queue');
}

function playNext(songId) {
  if (!songById(songId)) return;
  const at = player.index < 0 ? 0 : player.index + 1;
  player.queue.splice(at, 0, songId);
  if (player.index < 0) player.index = 0;
  renderQueuePanel();
  saveStateDebounced();
  toast('Will play next');
}

function removeFromQueue(index) {
  if (index < 0 || index >= player.queue.length) return;
  player.queue.splice(index, 1);
  if (index < player.index) player.index--;
  else if (index === player.index) {
    if (player.index >= player.queue.length) player.index = player.queue.length - 1;
    if (player.index >= 0 && player.queue.length) playSong(player.queue[player.index]);
    else if (!player.queue.length) { audio.pause(); player.current = null; audio.removeAttribute('src'); updatePlayerUI(); }
  }
  renderQueuePanel();
  saveStateDebounced();
}

function moveInQueue(from, to) {
  if (from < 0 || from >= player.queue.length) return;
  to = clamp(to, 0, player.queue.length - 1);
  if (from === to) return;
  const [item] = player.queue.splice(from, 1);
  player.queue.splice(to, 0, item);
  if (player.index === from) player.index = to;
  else if (from < player.index && to >= player.index) player.index--;
  else if (from > player.index && to <= player.index) player.index++;
  renderQueuePanel();
  saveStateDebounced();
}

function clearQueue() {
  player.queue = player.index >= 0 && player.current ? [player.current.id] : [];
  player.index = player.queue.length ? 0 : -1;
  renderQueuePanel();
  saveStateDebounced();
}

/* ---- Recent ---- */
function pushRecent(songId) {
  state.recent = [songId, ...state.recent.filter(id => id !== songId)].slice(0, 60);
  saveStateDebounced();
}

/* ---- Favorites ---- */
function toggleFavorite(songId) {
  if (state.favorites.has(songId)) state.favorites.delete(songId);
  else state.favorites.add(songId);
  saveStateDebounced();
  updateFavUI(songId);
  if (state.view === 'favorites') render();
  return state.favorites.has(songId);
}

function updateFavUI(songId) {
  const isFav = state.favorites.has(songId);
  $$(`[data-act="fav"][data-id="${songId}"]`).forEach(b => {
    b.classList.toggle('on', isFav);
    b.setAttribute('aria-pressed', String(isFav));
  });
  const npFav = $('#npFav');
  if (player.current && player.current.id === songId) {
    npFav.classList.toggle('on', isFav);
  }
}

/* =====================================================================
   6. UI RENDERING
   ===================================================================== */
const viewRoot = $('#viewRoot');

function sortSongs(list) {
  const arr = list.slice();
  switch (state.sort) {
    case 'artist':
      arr.sort((a, b) => (a.artist || '').localeCompare(b.artist || '') || (a.title || '').localeCompare(b.title || ''));
      break;
    case 'album':
      arr.sort((a, b) => (a.album || '').localeCompare(b.album || '') || (a.title || '').localeCompare(b.title || ''));
      break;
    case 'added':
      arr.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
      break;
    case 'duration':
      arr.sort((a, b) => (a.duration || 0) - (b.duration || 0));
      break;
    default:
      arr.sort((a, b) => (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' }));
  }
  return arr;
}

function registerList(key, ids) {
  listRegistry.set(key, ids);
  return key;
}

function trackRow(song, opts = {}) {
  const isFav = state.favorites.has(song.id);
  const isCur = player.current && player.current.id === song.id;
  const showAlbum = opts.showAlbum !== false;
  return `<div class="track${isCur ? ' current' : ''}" data-id="${song.id}" data-track="1" tabindex="0" role="button"
       aria-label="Play ${esc(song.title)} by ${esc(song.artist)}">
    <div class="track-art"><img loading="lazy" src="${esc(songArt(song))}" alt=""></div>
    <div class="track-main">
      <div class="track-title">${esc(song.title)}</div>
      <div class="track-sub">${esc(song.artist)}${showAlbum && song.album && song.album !== 'Unknown Album' ? ' • ' + esc(song.album) : ''}</div>
    </div>
    <div class="track-album">${esc(song.album)}</div>
    <div class="track-end">
      <div class="track-actions">
        <button class="icon-btn${isFav ? ' on heart' : ''}" data-act="fav" data-id="${song.id}"
          aria-label="Toggle favorite" aria-pressed="${isFav}">
          <svg viewBox="0 0 24 24"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 0 1 6.5 4 4.9 4.9 0 0 1 12 6.59 4.9 4.9 0 0 1 17.5 4 4.5 4.5 0 0 1 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
        </button>
        <button class="icon-btn" data-act="menu" data-id="${song.id}" aria-label="More options">
          <svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        </button>
      </div>
      <div class="track-dur">${fmtTime(song.duration)}</div>
    </div>
  </div>`;
}

function trackListHTML(songs, listKey, opts = {}) {
  if (!songs.length) return '';
  registerList(listKey, songs.map(s => s.id));
  return `<div class="tracklist" data-list="${esc(listKey)}">${songs.map(s => trackRow(s, opts)).join('')}</div>`;
}

function emptyState(icon, title, text, btnId, btnLabel) {
  return `<div class="empty">
    <div class="empty-icon"><svg viewBox="0 0 24 24">${icon}</svg></div>
    <h3>${esc(title)}</h3>
    <p>${esc(text)}</p>
    ${btnId ? `<button class="btn primary" id="${btnId}">${esc(btnLabel)}</button>` : ''}
  </div>`;
}

const ICONS = {
  music: '<path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/>',
  heart: '<path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 0 1 6.5 4 4.9 4.9 0 0 1 12 6.59 4.9 4.9 0 0 1 17.5 4 4.5 4.5 0 0 1 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/>',
  search: '<path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>',
  list: '<path d="M3 5h14v2H3zm0 6h14v2H3zm0 6h9v2H3zm14.5-6.5v7.2a2.8 2.8 0 1 1-2-2.7V8.5l4-1v2z"/>'
};

/* ---------- Render dispatcher ---------- */
function render() {
  const q = state.search.trim();
  if (q) { renderSearch(q); updateNavActive(); return; }
  switch (state.view) {
    case 'songs':     renderSongs(); break;
    case 'albums':    state.viewParam ? renderAlbumDetail(state.viewParam) : renderAlbums(); break;
    case 'artists':   state.viewParam ? renderArtistDetail(state.viewParam) : renderArtists(); break;
    case 'playlists': state.viewParam ? renderPlaylistDetail(state.viewParam) : renderPlaylists(); break;
    case 'favorites': renderFavorites(); break;
    case 'recent':    renderRecentView(); break;
    default:          renderHome();
  }
  updateNavActive();
}

function updateNavActive() {
  $$('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view && !state.search.trim());
  });
}

/* ---------- HOME ---------- */
function renderHome() {
  if (!state.library.length) {
    viewRoot.innerHTML = emptyState(
      ICONS.music,
      'Your library is empty',
      'Import audio files from this device to build your library. Supported formats include MP3, WAV, AAC, M4A, OGG and FLAC.',
      'emptyImport', 'Import Music'
    );
    $('#emptyImport').addEventListener('click', openFilePicker);
    return;
  }

  const recentSongs = state.recent.map(songById).filter(Boolean).slice(0, 12);
  const added = state.library.slice().sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).slice(0, 12);
  const favs = [...state.favorites].map(songById).filter(Boolean).slice(0, 12);
  const albumKeys = new Set(state.library.map(s => s.album || 'Unknown Album'));

  let html = `
    <div class="hero">
      <div>
        <h1>Welcome back</h1>
        <p>Your library lives entirely on this device. Import music, build playlists and listen offline.</p>
      </div>
      <div class="hero-stats">
        <div class="stat"><b>${state.library.length}</b><span>Songs</span></div>
        <div class="stat"><b>${albumKeys.size}</b><span>Albums</span></div>
        <div class="stat"><b>${state.playlists.length}</b><span>Playlists</span></div>
        <div class="stat"><b>${state.favorites.size}</b><span>Favorites</span></div>
      </div>
    </div>`;

  if (recentSongs.length) {
    html += `<div class="section">
      <div class="section-head"><h2 class="section-title">Recently Played</h2>
        <button class="btn ghost" data-goto="recent">View all</button></div>
      <div class="rail">${recentSongs.map(songCard).join('')}</div>
    </div>`;
  }

  html += `<div class="section">
    <div class="section-head"><h2 class="section-title">Recently Added</h2>
      <button class="btn ghost" data-goto="songs">View all</button></div>
    <div class="rail">${added.map(songCard).join('')}</div>
  </div>`;

  if (favs.length) {
    html += `<div class="section">
      <div class="section-head"><h2 class="section-title">Favorites</h2>
        <button class="btn ghost" data-goto="favorites">View all</button></div>
      <div class="rail">${favs.map(songCard).join('')}</div>
    </div>`;
  }

  viewRoot.innerHTML = html;
}

function songCard(song) {
  return `<button class="card" data-track="1" data-id="${song.id}" tabindex="0" aria-label="Play ${esc(song.title)}">
    <div class="card-art"><img loading="lazy" src="${esc(songArt(song))}" alt=""></div>
    <div class="card-title">${esc(song.title)}</div>
    <div class="card-sub">${esc(song.artist)}</div>
  </button>`;
}

/* ---------- SONGS ---------- */
function renderSongs() {
  if (!state.library.length) {
    viewRoot.innerHTML = emptyState(ICONS.music, 'No songs yet',
      'Import audio files to see them here.', 'emptyImport', 'Import Music');
    $('#emptyImport').addEventListener('click', openFilePicker);
    return;
  }
  const songs = sortSongs(state.library);
  viewRoot.innerHTML = `
    <h1 class="page-title">All Songs</h1>
    <p class="section-sub" style="margin-bottom:20px">${songs.length} song${songs.length === 1 ? '' : 's'}</p>
    ${trackListHTML(songs, 'all-songs')}`;
}

/* ---------- ALBUMS ---------- */
function albumGroups() {
  const map = new Map();
  for (const s of state.library) {
    const key = s.album || 'Unknown Album';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(s);
  }
  return map;
}

function renderAlbums() {
  if (!state.library.length) {
    viewRoot.innerHTML = emptyState(ICONS.music, 'No albums yet', 'Import music to build your album collection.', 'emptyImport', 'Import Music');
    $('#emptyImport').addEventListener('click', openFilePicker);
    return;
  }
  const groups = [...albumGroups().entries()].sort((a, b) => a[0].localeCompare(b[0]));
  viewRoot.innerHTML = `
    <h1 class="page-title">Albums</h1>
    <p class="section-sub" style="margin-bottom:20px">${groups.length} album${groups.length === 1 ? '' : 's'}</p>
    <div class="grid">
      ${groups.map(([name, songs]) => {
        const art = songs.find(s => s.artwork);
        const artist = songs[0].artist;
        return `<button class="card" data-album="${esc(name)}" tabindex="0">
          <div class="card-art"><img loading="lazy" src="${esc(art ? art.artwork : PLACEHOLDER_ART)}" alt=""></div>
          <div class="card-title">${esc(name)}</div>
          <div class="card-sub">${esc(artist)} • ${songs.length} song${songs.length === 1 ? '' : 's'}</div>
        </button>`;
      }).join('')}
    </div>`;
}

function renderAlbumDetail(albumName) {
  const songs = sortSongs(state.library.filter(s => (s.album || 'Unknown Album') === albumName));
  if (!songs.length) { state.viewParam = null; renderAlbums(); return; }
  const art = songs.find(s => s.artwork);
  const artist = songs[0].artist;
  const total = songs.reduce((a, s) => a + (s.duration || 0), 0);
  const key = 'album-' + albumName;
  registerList(key, songs.map(s => s.id));

  viewRoot.innerHTML = `
    <button class="btn ghost" data-back="1" style="margin-bottom:18px">← Back</button>
    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;margin-bottom:26px">
      <div style="width:180px;height:180px;border-radius:18px;overflow:hidden;flex:0 0 auto;box-shadow:0 18px 44px rgba(0,0,0,.5)">
        <img src="${esc(art ? art.artwork : PLACEHOLDER_ART)}" style="width:100%;height:100%;object-fit:cover" alt="">
      </div>
      <div style="min-width:200px">
        <div class="section-sub" style="text-transform:uppercase;letter-spacing:1.2px;font-weight:800">Album</div>
        <h1 class="page-title" style="margin:6px 0 8px">${esc(albumName)}</h1>
        <div class="section-sub">${esc(artist)} • ${songs.length} songs • ${fmtTime(total)}</div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn primary" data-playalbum="${esc(key)}">Play</button>
          <button class="btn ghost" data-shufflealbum="${esc(key)}">Shuffle</button>
        </div>
      </div>
    </div>
    ${trackListHTML(songs, key)}`;
}

      <p class="section-sub">${state.playlists.length} playlist${state.playlists.length === 1 ? '' : 's'}</p></div>

      'newPlaylistBtn2', 'Create Playlist');

    html += `<div class="grid">${state.playlists.map(p => {

  if (!pl) { state.viewParam = null; renderPlaylists(); return; }
  const songs = pl.songIds.map(songById).filter(Boolean);
  const key = 'playlist-' + id;
  registerList(key, songs.map(s => s.id));
  const total = songs.reduce((a, s) => a + (s.duration || 0), 0);
  const art = songs.find(s => s.artwork);

  viewRoot.innerHTML = `
    <button class="btn ghost" data-back="1" style="margin-bottom:18px">← Back</button>

      <div style="min-width:220px">

        <h1 class="page-title" style="margin:6px 0 8px">${esc(pl.name)}</h1>
        <div class="section-sub">${songs.length} songs • ${fmtTime(total)}</div>

          <button class="btn danger" data-deletepl="${id}">Delete</button>
        </div>
      </div>

    ${songs.length ? trackListHTML(songs, key) : emptyState(ICONS.music, 'This playlist is empty',

}

function createPlaylistFlow() {
  promptDialog('New Playlist', 'My Playlist', 'Create').then(name => {
    if (!name) return;
    const pl = { id: uid(), name, songIds: [] };
    state.playlists.push(pl);
    saveState();
    render();
    toast('Playlist "' + name + '" created');
  });
}

/* ---------- SEARCH ---------- */
function renderSearch(q) {
  const needle = q.toLowerCase();
  const results = state.library.filter(s =>
    (s.title || '').toLowerCase().includes(needle) ||
    (s.artist || '').toLowerCase().includes(needle) ||
    (s.album || '').toLowerCase().includes(needle)
  );
  if (!results.length) {
    viewRoot.innerHTML = emptyState(ICONS.search, 'No results',
      `Nothing in your library matches "${q}".`, null, '');
    return;
  }
  const key = 'search';
  const sorted = sortSongs(results);
  viewRoot.innerHTML = `
    <h1 class="page-title">Search</h1>
    <p class="section-sub" style="margin-bottom:20px">${results.length} result${results.length === 1 ? '' : 's'} for "${esc(q)}"</p>
    <div style="display:flex;gap:10px;margin-bottom:18px">
      <button class="btn primary" data-playalbum="${key}">Play Results</button>
      <button class="btn ghost" data-shufflealbum="${key}">Shuffle</button>
    </div>
    ${trackListHTML(sorted, key)}`;
}

/* =====================================================================
   NOW PLAYING / MINI PLAYER UI SYNC
   ===================================================================== */
function updatePlayerUI() {
  const s = player.current;
  const hasSong = !!s;

  $('#miniplayer').classList.toggle('show', hasSong);
  document.documentElement.style.setProperty('--mini-h', hasSong ? '74px' : '0px');

  $('#miniArt').src = songArt(s);
  $('#miniTitle').textContent = hasSong ? s.title : 'Nothing playing';
  $('#miniArtist').textContent = hasSong ? s.artist : '—';

  $('#npArt').src = songArt(s);
  $('#npBg').style.backgroundImage = `url("${songArt(s)}")`;
  $('#npTitle').textContent = hasSong ? s.title : 'Nothing playing';
  $('#npArtist').textContent = hasSong ? s.artist : 'Import music to get started';
  $('#npAlbum').textContent = hasSong && s.album !== 'Unknown Album' ? s.album : '';

  const playing = hasSong && !audio.paused && !player.loading;
  const playPath = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $('#npPlayIcon').innerHTML = playPath;
  $('#miniPlayIcon').innerHTML = playPath;
  $('#npPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('#miniPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');

  if (player.loading) {
    $('#npPlayIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  }

  $('#npFav').classList.toggle('on', hasSong && state.favorites.has(s.id));
  $('#npShuffle').classList.toggle('on', player.shuffle);
  $('#qpShuffle').classList.toggle('on', player.shuffle);

  const repeatBtn = $('#npRepeat');
  repeatBtn.classList.toggle('on', player.repeat !== 'off');
  repeatBtn.setAttribute('aria-label', 'Repeat: ' + player.repeat);
  repeatBtn.style.position = 'relative';
  if (player.repeat === 'one') {
    if (!repeatBtn.dataset.one) {
      const badge = document.createElement('span');
      badge.textContent = '1';
      badge.style.cssText = 'position:absolute;bottom:2px;right:4px;font-size:10px;font-weight:800;background:var(--accent-2);color:#062;border-radius:50%;width:14px;height:14px;display:grid;place-items:center;';
      repeatBtn.appendChild(badge);
      repeatBtn.dataset.one = '1';
    }
  } else if (repeatBtn.dataset.one) {
    repeatBtn.querySelector('span').remove();
    delete repeatBtn.dataset.one;
  }

  // Times
  const dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (s ? s.duration : 0);
  if (!npSeeking) {
    $('#npCur').textContent = fmtTime(audio.currentTime);
    $('#npDur').textContent = fmtTime(dur);
    const pct = dur > 0 ? (audio.currentTime / dur) * 1000 : 0;
    const seekEl = $('#npSeek');
    seekEl.value = String(pct);
    seekEl.style.setProperty('--p', (pct / 10) + '%');
  }
  const mpct = dur > 0 ? (audio.currentTime / dur) * 100 : 0;
  $('#miniProgressFill').style.width = mpct + '%';

  updateVolumeUI();
  updateMediaSession();
  refreshTrackHighlight();
}

function updateVolumeUI() {
  const v = player.muted ? 0 : player.volume;
  $('#npVolume').value = String(player.volume);
  $('#miniVolume').value = String(player.volume);
  const icon = player.muted || player.volume === 0
    ? '<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM3 4.27 4.27 3 9 7.73V4l5 5-2.06 2.06L21 20.27 19.73 21.54l-4.5-4.5A10 10 0 0 1 14 17.7v2.06a9 9 0 0 1-3.69-1.81L8.5 19.5 3 14v-4h3.73z"/>'
    : player.volume < 0.5
      ? '<path d="M3 9v6h4l5 5V4L7 9z"/><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12z"/>'
      : '<path d="M3 9v6h4l5 5V4L7 9z"/><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06A7 7 0 0 1 14 18.7v2.06a9 9 0 0 0 0-17.53z"/>';
  $('#npVolIcon').innerHTML = icon;
}

function refreshTrackHighlight() {
  const curId = player.current ? player.current.id : null;
  $$('#viewRoot .track').forEach(el => {
    el.classList.toggle('current', el.dataset.id === curId);
  });
}

/* =====================================================================
   QUEUE PANEL
   ===================================================================== */
function renderQueuePanel() {
  const list = $('#qpList');
  if (!player.queue.length) {
    list.innerHTML = '<div style="padding:34px 16px;text-align:center;color:var(--muted-2);font-size:13.5px">The queue is empty.</div>';
    return;

  list.innerHTML = player.queue.map((id, i) => {
    const s = songById(id);
    if (!s) return '';
    const isCur = i === player.index;
    return `<div class="qp-item${isCur ? ' current' : ''}" data-qidx="${i}" data-qid="${id}" tabindex="0" role="button">
      <div class="qp-art"><img loading="lazy" src="${esc(songArt(s))}" alt=""></div>
      <div class="qp-meta">
        <div class="qp-title">${esc(s.title)}</div>
        <div class="qp-sub">${esc(s.artist)}</div>
      </div>
      <div class="qp-actions">
        <button class="icon-btn" data-qact="up" data-qidx="${i}" aria-label="Move up">
          <svg viewBox="0 0 24 24"><path d="M12 6 5 15h14z"/></svg>
        </button>
        <button class="icon-btn" data-qact="down" data-qidx="${i}" aria-label="Move down">
          <svg viewBox="0 0 24 24"><path d="M12 18 5 9h14z"/></svg>
        </button>
        <button class="icon-btn" data-qact="remove" data-qidx="${i}" aria-label="Remove from queue">
          <svg viewBox="0 0 24 24"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.3 9.17 12 2.89 5.71 4.3 4.29l6.29 6.3 6.3-6.3z"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

/* =====================================================================
   MODALS
   ===================================================================== */
const overlays = [];

function pushOverlay(closeFn) {
  overlays.push(closeFn);
  try { history.pushState({ ov: overlays.length }, ''); } catch (e) { /* ignore */ }
}

function closeTopOverlay(fromPop) {
  const fn = overlays.pop();
  if (fn) fn();
  if (!fromPop && history.state && history.state.ov) {
    try { history.back(); } catch (e) { /* ignore */ }
  }
}

window.addEventListener('popstate', () => {

function openModal(html, onMount) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop" data-close="1"></div><div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  root.classList.add('open');

  const close = () => {
    root.classList.remove('open');
    root.innerHTML = '';
  };
  root.querySelector('.modal-backdrop').addEventListener('click', () => closeTopOverlay(false));
  pushOverlay(close);
  if (onMount) onMount(root.querySelector('.modal'), close);
  const first = root.querySelector('input, button');
  if (first) setTimeout(() => first.focus(), 60);
  return close;
}

function promptDialog(title, defaultValue, confirmLabel) {
  return new Promise(resolve => {
    let settled = false;
    openModal(`
      <h3>${esc(title)}</h3>
      <div class="modal-body">
        <input class="text-input" id="modalInput" type="text" value="${esc(defaultValue || '')}" placeholder="Enter a name">
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-cancel="1">Cancel</button>
        <button class="btn primary" data-ok="1">${esc(confirmLabel || 'Save')}</button>
      </div>`, (modal, close) => {
      const input = modal.querySelector('#modalInput');
      const finish = (val) => {
        if (settled) return;
        settled = true;
        resolve(val);
        closeTopOverlay(false);
      };
      modal.querySelector('[data-cancel]').addEventListener('click', () => finish(null));
      modal.querySelector('[data-ok]').addEventListener('click', () => {
        const v = input.value.trim();
        if (!v) { input.focus(); return; }
        finish(v);
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); modal.querySelector('[data-ok]').click(); }
      });
      // if closed by overlay pop, resolve null
      const obs = new MutationObserver(() => {
        if (!document.body.contains(modal) && !settled) { settled = true; resolve(null); obs.disconnect(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      setTimeout(() => { input.focus(); input.select(); }, 80);
    });
  });
}

function confirmDialog(title, message, confirmLabel, danger) {
  return new Promise(resolve => {
    let settled = false;
    openModal(`
      <h3>${esc(title)}</h3>
      <div class="modal-body"><p>${esc(message)}</p></div>
      <div class="modal-foot">
        <button class="btn ghost" data-cancel="1">Cancel</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" data-ok="1">${esc(confirmLabel || 'Confirm')}</button>
      </div>`, (modal, close) => {
      const finish = v => {
        if (settled) return;
        settled = true;
        resolve(v);
        closeTopOverlay(false);
      };
      modal.querySelector('[data-cancel]').addEventListener('click', () => finish(false));
      modal.querySelector('[data-ok]').addEventListener('click', () => finish(true));
      const obs = new MutationObserver(() => {
        if (!document.body.contains(modal) && !settled) { settled = true; resolve(false); obs.disconnect(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    });
  });
}

function playlistPicker(songId) {
  const rows = state.playlists.map(p => `
    <button class="pick-row" data-pl="${p.id}">
      <span class="dot">♪</span>
      <span><span class="nm">${esc(p.name)}</span><br><span class="ct">${p.songIds.length} song${p.songIds.length === 1 ? '' : 's'}</span></span>
    </button>`).join('');

  openModal(`
    <h3>Add to Playlist</h3>
    <div class="modal-body">
      ${rows || '<p style="color:var(--muted-2);font-size:13.5px">You have no playlists yet.</p>'}
      <button class="pick-row" data-newpl="1" style="margin-top:6px">
        <span class="dot">+</span><span class="nm">New Playlist</span>
      </button>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-cancel="1">Close</button></div>`,
    (modal, close) => {
      modal.querySelector('[data-cancel]').addEventListener('click', () => closeTopOverlay(false));
      modal.querySelectorAll('[data-pl]').forEach(btn => {
        btn.addEventListener('click', () => {
          const pl = state.playlists.find(p => p.id === btn.dataset.pl);
          if (!pl) return;
          if (!pl.songIds.includes(songId)) pl.songIds.push(songId);
          saveState();
          closeTopOverlay(false);
          toast(`Added to "${pl.name}"`);
          if (state.view === 'playlists') render();
        });
      });
      modal.querySelector('[data-newpl]').addEventListener('click', async () => {
        closeTopOverlay(false);
        const name = await promptDialog('New Playlist', 'My Playlist', 'Create');
        if (!name) return;
        const pl = { id: uid(), name, songIds: [songId] };
        state.playlists.push(pl);
        saveState();
        toast(`Added to "${name}"`);
        if (state.view === 'playlists') render();
      });
    });
}

/* =====================================================================
   LIBRARY OPERATIONS
   ===================================================================== */
async function deleteSong(songId) {
  try {
    await dbDelete('songs', songId);
    await dbDelete('files', songId);
  } catch (e) { /* ignore */ }

  state.library = state.library.filter(s => s.id !== songId);
  state.favorites.delete(songId);
  state.recent = state.recent.filter(id => id !== songId);
  state.playlists.forEach(p => { p.songIds = p.songIds.filter(id => id !== songId); });

  const qi = player.queue.indexOf(songId);
  if (qi >= 0) removeFromQueue(qi);
  if (player.current && player.current.id === songId) {
    audio.pause();
    audio.removeAttribute('src');
    if (player.objectUrl) { URL.revokeObjectURL(player.objectUrl); player.objectUrl = null; }
    player.current = null;
    updatePlayerUI();
  }

  saveState();
  render();
  toast('Removed from library');
}

   7. FILE IMPORT
   ===================================================================== */
const fileInput = $('#fileInput');

function openFilePicker() {
  fileInput.value = '';
  fileInput.click();

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => {
    if (f.type && f.type.startsWith('audio/')) return true;
    return /\.(mp3|wav|aac|m4a|ogg|oga|opus|flac|weba|wma|aiff|aif|mp4|m4b)$/i.test(f.name);
  });

  if (!files.length) {
    toast('No supported audio files were selected', 'error');
    return;
  }

  toast(`Importing ${files.length} file${files.length === 1 ? '' : 's'}…`);
  let imported = 0, failed = 0;
  const newSongs = [];

  for (const file of files) {
    try {
      const meta = await extractMetadata(file);
      if (!meta.duration) {
        // Some formats (e.g. certain FLAC/WAV) may not decode. Still allow import —
        // the browser will report an error at playback time if it truly can't play it.
      }
      const song = {
        id: uid(),
        title: meta.title,
        artist: meta.artist,
        album: meta.album,
        duration: meta.duration,
        artwork: meta.artwork,
        fileName: file.name,
        fileType: file.type || '',
        fileSize: file.size,
        addedAt: Date.now()
      };
      await dbPut('songs', song);
      await dbPut('files', file, song.id);
      state.library.push(song);
      newSongs.push(song);
      imported++;
    } catch (err) {
      console.error('[Pulse] import failed', file.name, err);
      failed++;
    }
  }

  state.library.sort((a, b) => a.title.localeCompare(b.title));
  saveState();

  if (imported) {
    toast(`Imported ${imported} song${imported === 1 ? '' : 's'}${failed ? `, ${failed} failed` : ''}`);
    if (state.view === 'home' || !state.library.length) { /* keep view */ }
    render();

    // Auto-queue newly imported songs if nothing is queued
    if (!player.queue.length) {
      setQueue(newSongs.map(s => s.id), 0);
    }
  } else {
    toast('Import failed — unsupported or unreadable files', 'error');
  }
  updateStorageNote();
}

fileInput.addEventListener('change', () => {
  if (fileInput.files && fileInput.files.length) handleFiles(fileInput.files);
});

async function updateStorageNote() {
  const el = $('#storageNote');
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      const used = est.usage || 0;
      el.textContent = `${state.library.length} song${state.library.length === 1 ? '' : 's'} stored • ${(used / 1048576).toFixed(1)} MB used`;
    } else {
      el.textContent = `${state.library.length} song${state.library.length === 1 ? '' : 's'} stored locally`;
    }
  } catch (e) {
    el.textContent = `${state.library.length} song${state.library.length === 1 ? '' : 's'} stored locally`;
  }
}
